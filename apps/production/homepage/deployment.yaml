apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.7.0@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f
          env:
            - { name: HOMEPAGE_ALLOWED_HOSTS, value: home.xzr.es }
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
          ports:
            - { name: http, containerPort: 3000 }
          # homepage rejects any Host outside HOMEPAGE_ALLOWED_HOSTS, the kubelet's pod IP included
          readinessProbe:
            httpGet: { path: /api/healthcheck, port: http, httpHeaders: [{ name: Host, value: home.xzr.es }] }
          livenessProbe:
            httpGet: { path: /api/healthcheck, port: http, httpHeaders: [{ name: Host, value: home.xzr.es }] }
            initialDelaySeconds: 30
          resources:
            requests: { cpu: 10m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            # writable config dir (homepage adds logs/ and any file missing below), files from the ConfigMap
            - { name: config, mountPath: /app/config }
            - { name: files, mountPath: /app/config/settings.yaml, subPath: settings.yaml }
            - { name: files, mountPath: /app/config/widgets.yaml, subPath: widgets.yaml }
            - { name: files, mountPath: /app/config/services.yaml, subPath: services.yaml }
            - { name: files, mountPath: /app/config/bookmarks.yaml, subPath: bookmarks.yaml }
            - { name: files, mountPath: /app/config/kubernetes.yaml, subPath: kubernetes.yaml }
            - { name: files, mountPath: /app/config/docker.yaml, subPath: docker.yaml }
            - { name: files, mountPath: /app/config/custom.css, subPath: custom.css }
            - { name: files, mountPath: /app/config/custom.js, subPath: custom.js }
            - { name: next-cache, mountPath: /app/.next/cache }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: config, emptyDir: {} }
        - { name: files, configMap: { name: homepage } }
        - { name: next-cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
