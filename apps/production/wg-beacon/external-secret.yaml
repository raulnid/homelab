# .env + the two keys the client reads from ./pem (see wg-beacon README)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wg-beacon
  namespace: wg-beacon
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: wg-beacon
    template:
      type: Opaque
      data:
        .env: |
          HOST={{ .host }}
          PORT={{ .port }}
          ENDPOINT={{ .endpoint }}
        client_private: "{{ .client_private }}"
        server_public: "{{ .server_public }}"
  data:
    - secretKey: host
      remoteRef:
        key: apps/wg-beacon
        property: host
    - secretKey: port
      remoteRef:
        key: apps/wg-beacon
        property: port
    - secretKey: endpoint
      remoteRef:
        key: apps/wg-beacon
        property: endpoint
    - secretKey: client_private
      remoteRef:
        key: apps/wg-beacon
        property: client_private
    - secretKey: server_public
      remoteRef:
        key: apps/wg-beacon
        property: server_public
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-pull
  namespace: wg-beacon
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: harbor-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"hub.xzr.es":{"auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: infra/harbor/pull
        property: username
    - secretKey: password
      remoteRef:
        key: infra/harbor/pull
        property: password
