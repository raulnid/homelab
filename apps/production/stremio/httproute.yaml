apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stremio
spec:
  parentRefs:
  - name: cilium-gateway
    namespace: kube-system
  hostnames:
  - "stremio.xzr.es"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: "/"
    backendRefs:
    - name: stremio
      port: 8080
