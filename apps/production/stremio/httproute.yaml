apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stremio
spec:
  parentRefs:
  - name: cilium-gateway
    namespace: kube-system
  hostnames:
  - "stremio.xzr.es"
  rules:
  # no request timeout: video streams and multi-GB uploads outlive Envoy's 15s default
  - timeouts:
      request: 0s
    matches:
    - path:
        type: PathPrefix
        value: "/"
    backendRefs:
    - name: stremio
      port: 8080
