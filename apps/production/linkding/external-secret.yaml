apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkding-pg-ca
  namespace: linkding
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: linkding-pg-ca
    template:
      type: Opaque
      data:
        ca.crt: "{{ .ca }}"
  data:
    - secretKey: ca
      remoteRef:
        key: k8s/step-ca
        property: content
---
# rotated by OpenBao every 24h; Reloader restarts the pod when it changes
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkding-db-creds
  namespace: linkding
spec:
  refreshInterval: "30s"
  secretStoreRef:
    name: openbao-db-store
    kind: ClusterSecretStore
  target:
    name: linkding-db-creds
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: database/static-creds/linkding_readwrite_static
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkding
  namespace: linkding
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: linkding
  data:
    - secretKey: superuser-name
      remoteRef: { key: apps/linkding, property: superuser_name }
    - secretKey: superuser-password
      remoteRef: { key: apps/linkding, property: superuser_password }
    # Django SECRET_KEY: linkding reads it from data/secretkey.txt; kept in OpenBao so sessions survive restarts
    - secretKey: secretkey.txt
      remoteRef: { key: apps/linkding, property: secret_key }
