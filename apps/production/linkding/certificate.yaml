# Client certificate for the "linkding" Postgres user (24h, OpenBao PKI); pg_hba requires it on top of the password.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: linkding-postgres
  namespace: linkding
spec:
  secretName: linkding-pg-tls
  duration: 24h
  renewBefore: 8h
  commonName: linkding
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - client auth
    - digital signature
    - key encipherment
  issuerRef:
    name: openbao-pg-client
    kind: ClusterIssuer
    group: cert-manager.io
