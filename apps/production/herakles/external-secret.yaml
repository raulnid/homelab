# step-ca root, to verify the wildcard on the gateway. Read again every cycle, so a rotation needs no restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: herakles-ca
  namespace: herakles
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: herakles-ca
    template:
      type: Opaque
      data:
        ca.crt: "{{ .ca }}"
  data:
    - secretKey: ca
      remoteRef:
        key: k8s/step-ca
        property: content
