apiVersion: apps/v1
kind: Deployment
metadata:
  name: miniflux
  namespace: miniflux
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: miniflux
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: miniflux
  template:
    metadata:
      labels:
        app.kubernetes.io/name: miniflux
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: miniflux
          image: miniflux/miniflux:2.3.5@sha256:8fd6c3c434ecc3d4083306f83e03c0bb74c632e0f8378da5ead7e1773b0b89c9
          env:
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: miniflux-db-creds, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: miniflux-db-creds, key: password } }
            - name: DATABASE_URL
              value: "host=pg-rw.pg-internal.svc.cluster.local dbname=miniflux user=$(DB_USER) password=$(DB_PASSWORD) sslmode=verify-full sslrootcert=/etc/pg-ca/ca.crt sslcert=/etc/pg-tls/tls.crt sslkey=/etc/pg-tls/tls.key"
            - { name: RUN_MIGRATIONS, value: "1" }
            # creates the admin only if it doesn't exist yet
            - { name: CREATE_ADMIN, value: "1" }
            - name: ADMIN_USERNAME
              valueFrom: { secretKeyRef: { name: miniflux, key: admin-username } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: miniflux, key: admin-password } }
            - { name: BASE_URL, value: "https://rss.xzr.es/" }
            - { name: LISTEN_ADDR, value: "0.0.0.0:8080" }
            # Sign in with authentik; the local admin stays as a fallback and can link its account in Settings
            - { name: OAUTH2_PROVIDER, value: oidc }
            - { name: OAUTH2_OIDC_PROVIDER_NAME, value: authentik }
            - { name: OAUTH2_OIDC_DISCOVERY_ENDPOINT, value: "https://auth.xzr.es/application/o/miniflux/" }
            - { name: OAUTH2_REDIRECT_URL, value: "https://rss.xzr.es/oauth2/oidc/callback" }
            - { name: OAUTH2_USER_CREATION, value: "1" }
            - name: OAUTH2_CLIENT_ID
              valueFrom: { secretKeyRef: { name: miniflux-oidc, key: client-id } }
            - name: OAUTH2_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: miniflux-oidc, key: client-secret } }
            # Go adds every file in this dir to the system roots, so auth.xzr.es (step-ca) verifies and feeds still do
            - { name: SSL_CERT_DIR, value: /etc/pg-ca }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthcheck, port: http }
          livenessProbe:
            httpGet: { path: /healthcheck, port: http }
            initialDelaySeconds: 30
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: pg-ca, mountPath: /etc/pg-ca, readOnly: true }
            - { name: pg-tls, mountPath: /etc/pg-tls, readOnly: true }
      volumes:
        - name: pg-ca
          secret:
            secretName: miniflux-pg-ca
        - name: pg-tls
          secret:
            secretName: miniflux-pg-tls
            # libpq refuses a key readable by others; root-owned 0440 + fsGroup is accepted
            defaultMode: 0440
