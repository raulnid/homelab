apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miniflux-pg-ca
  namespace: miniflux
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: miniflux-pg-ca
    template:
      type: Opaque
      data:
        ca.crt: "{{ .ca }}"
  data:
    - secretKey: ca
      remoteRef:
        key: k8s/step-ca
        property: content
---
# rotated by OpenBao every 24h; Reloader restarts the pod when it changes
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miniflux-db-creds
  namespace: miniflux
spec:
  refreshInterval: "30s"
  secretStoreRef:
    name: openbao-db-store
    kind: ClusterSecretStore
  target:
    name: miniflux-db-creds
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: database/static-creds/miniflux_readwrite_static
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miniflux
  namespace: miniflux
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: miniflux
  data:
    - secretKey: admin-username
      remoteRef: { key: apps/miniflux, property: admin_username }
    - secretKey: admin-password
      remoteRef: { key: apps/miniflux, property: admin_password }
---
# OAuth client for the authentik "Provider for Miniflux" (same secret authentik reads)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miniflux-oidc
  namespace: miniflux
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: miniflux-oidc
    template:
      type: Opaque
      data:
        client-id: nqBOn0ruAlCD7CMb1ao9c5tA1aZ5v7joQ2TkwGfx
        client-secret: "{{ .secret }}"
  data:
    - secretKey: secret
      remoteRef:
        key: infra/authentik/data
        property: miniflux
