apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: projectsend
spec:
  parentRefs:
  - name: cilium-gateway
    namespace: kube-system
  hostnames:
  - "projectsend.xzr.es"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: "/"
    backendRefs:
    - name: projectsend
      port: 80
