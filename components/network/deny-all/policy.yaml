apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-all-audit
spec:
  endpointSelector:
    matchExpressions:
      - key: "k8s:io.kubernetes.pod.namespace"
        operator: Exists
      - key: "net/system-controller"
        operator: DoesNotExist
  ingress:
    - fromEntities:
        - host
  egress:
    - toEntities:
        - host
