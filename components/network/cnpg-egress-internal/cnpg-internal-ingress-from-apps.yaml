apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: cnpg-internal-ingress-from-apps
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: pg-internal
      cnpg.io/cluster: pg
      cnpg.io/instanceRole: primary
  ingress:
    - fromEndpoints:
        - matchLabels:
            net/to-cnpg-internal: "true"
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
