apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: apps-egress-to-cnpg-internal
spec:
  endpointSelector:
    matchLabels:
      net/to-cnpg-internal: "true"
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: pg-internal
            cnpg.io/cluster: pg
            cnpg.io/instanceRole: primary
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
