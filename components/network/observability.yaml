# Prometheus scrapes: exactly the active targets of kube-prometheus-stack.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: prometheus-scrape
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: monitoring
      app.kubernetes.io/name: prometheus
  egress:
    # apiserver, kubelet, node-exporter (host network)
    - toEntities: [host, remote-node, kube-apiserver]
      toPorts:
        - ports:
            - { port: "6443", protocol: TCP }
            - { port: "10250", protocol: TCP }
            - { port: "9100", protocol: TCP }
    - toEndpoints: [{ matchLabels: { k8s:io.kubernetes.pod.namespace: cert-manager, app.kubernetes.io/name: cert-manager } }]
      toPorts: [{ ports: [{ port: "9402", protocol: TCP }] }]
    - toEndpoints: [{ matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s:k8s-app: kube-dns } }]
      toPorts: [{ ports: [{ port: "9153", protocol: TCP }] }]
    # node-exporter of the VPS, reached through the tunnel pod
    - toEndpoints: [{ matchLabels: { k8s:io.kubernetes.pod.namespace: wireguard, app: wireguard } }]
      toPorts: [{ ports: [{ port: "9100", protocol: TCP }] }]
    - toEndpoints: [{ matchLabels: { k8s:io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: grafana } }]
      toPorts: [{ ports: [{ port: "3000", protocol: TCP }] }]
    - toEndpoints: [{ matchLabels: { k8s:io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: alertmanager } }]
      toPorts:
        - ports:
            - { port: "9093", protocol: TCP }   # alerts + metrics
            - { port: "8080", protocol: TCP }   # config-reloader metrics
    - toEndpoints: [{ matchLabels: { k8s:io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator } }]
      toPorts: [{ ports: [{ port: "10250", protocol: TCP }] }]
    - toEndpoints: [{ matchLabels: { k8s:io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: kube-state-metrics } }]
      toPorts: [{ ports: [{ port: "8080", protocol: TCP }] }]
    - toEndpoints: [{ matchLabels: { k8s:io.kubernetes.pod.namespace: blocky, app.kubernetes.io/name: blocky } }]
      toPorts: [{ ports: [{ port: "4000", protocol: TCP }] }]
    - toEndpoints: [{ matchLabels: { k8s:io.kubernetes.pod.namespace: herakles, app.kubernetes.io/name: herakles } }]
      toPorts: [{ ports: [{ port: "9090", protocol: TCP }] }]
    # /metrics on Garage's admin port, open without a token: this allow is the access control
    - toEndpoints: [{ matchLabels: { k8s:io.kubernetes.pod.namespace: garage, app.kubernetes.io/name: garage } }]
      toPorts: [{ ports: [{ port: "3903", protocol: TCP }] }]
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: prometheus-targets
specs:
  - endpointSelector: { matchLabels: { k8s:io.kubernetes.pod.namespace: cert-manager, app.kubernetes.io/name: cert-manager } }
    ingress: [{ fromEndpoints: [{ matchLabels: &prom { k8s:io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: prometheus } }], toPorts: [{ ports: [{ port: "9402", protocol: TCP }] }] }]
  - endpointSelector: { matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s:k8s-app: kube-dns } }
    ingress: [{ fromEndpoints: [{ matchLabels: *prom }], toPorts: [{ ports: [{ port: "9153", protocol: TCP }] }] }]
  - endpointSelector: { matchLabels: { k8s:io.kubernetes.pod.namespace: wireguard, app: wireguard } }
    ingress: [{ fromEndpoints: [{ matchLabels: *prom }], toPorts: [{ ports: [{ port: "9100", protocol: TCP }] }] }]
  - endpointSelector: { matchLabels: { k8s:io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: grafana } }
    ingress: [{ fromEndpoints: [{ matchLabels: *prom }], toPorts: [{ ports: [{ port: "3000", protocol: TCP }] }] }]
  - endpointSelector: { matchLabels: { k8s:io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator } }
    ingress: [{ fromEndpoints: [{ matchLabels: *prom }], toPorts: [{ ports: [{ port: "10250", protocol: TCP }] }] }]
  - endpointSelector: { matchLabels: { k8s:io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: kube-state-metrics } }
    ingress: [{ fromEndpoints: [{ matchLabels: *prom }], toPorts: [{ ports: [{ port: "8080", protocol: TCP }] }] }]
  - endpointSelector: { matchLabels: { k8s:io.kubernetes.pod.namespace: blocky, app.kubernetes.io/name: blocky } }
    ingress: [{ fromEndpoints: [{ matchLabels: *prom }], toPorts: [{ ports: [{ port: "4000", protocol: TCP }] }] }]
  - endpointSelector: { matchLabels: { k8s:io.kubernetes.pod.namespace: herakles, app.kubernetes.io/name: herakles } }
    ingress: [{ fromEndpoints: [{ matchLabels: *prom }], toPorts: [{ ports: [{ port: "9090", protocol: TCP }] }] }]
  - endpointSelector: { matchLabels: { k8s:io.kubernetes.pod.namespace: garage, app.kubernetes.io/name: garage } }
    ingress: [{ fromEndpoints: [{ matchLabels: *prom }], toPorts: [{ ports: [{ port: "3903", protocol: TCP }] }] }]
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: alertmanager
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: monitoring
      app.kubernetes.io/name: alertmanager
  ingress:
    - fromEndpoints: [{ matchLabels: { k8s:io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: prometheus } }]
      toPorts:
        - ports:
            - { port: "9093", protocol: TCP }
            - { port: "8080", protocol: TCP }
    - fromEndpoints: [{ matchLabels: { k8s:io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: grafana } }]
      toPorts: [{ ports: [{ port: "9093", protocol: TCP }] }]
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: grafana-datasources
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: monitoring
      app.kubernetes.io/name: grafana
  egress:
    - toEndpoints: [{ matchLabels: { k8s:io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: prometheus } }]
      toPorts: [{ ports: [{ port: "9090", protocol: TCP }] }]
    - toEndpoints: [{ matchLabels: { k8s:io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: alertmanager } }]
      toPorts: [{ ports: [{ port: "9093", protocol: TCP }] }]
    - toEndpoints: [{ matchLabels: { k8s:io.kubernetes.pod.namespace: logging, app.kubernetes.io/name: loki } }]
      toPorts: [{ ports: [{ port: "3100", protocol: TCP }] }]
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: prometheus-from-grafana
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: monitoring
      app.kubernetes.io/name: prometheus
  ingress:
    - fromEndpoints: [{ matchLabels: { k8s:io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: grafana } }]
      toPorts: [{ ports: [{ port: "9090", protocol: TCP }] }]
---
# Logs: alloy (DaemonSet) and LAN/VPS shippers through the 192.168.1.243 VIP push to Loki, Grafana queries it
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: loki
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: logging
      app.kubernetes.io/name: loki
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: logging, app.kubernetes.io/name: alloy }
        - matchLabels: { k8s:io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: grafana }
      toPorts: [{ ports: [{ port: "3100", protocol: TCP }] }]
    - fromEntities: [world]
      toPorts: [{ ports: [{ port: "3100", protocol: TCP }] }]
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: alloy
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: logging
      app.kubernetes.io/name: alloy
  egress:
    - toEndpoints: [{ matchLabels: { k8s:io.kubernetes.pod.namespace: logging, app.kubernetes.io/name: loki } }]
      toPorts: [{ ports: [{ port: "3100", protocol: TCP }] }]
