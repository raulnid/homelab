apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Default-deny for every pod plus one allow per flow, verified against Hubble in audit mode.
resources:
  - default-deny.yaml
  - control-plane.yaml
  - dns.yaml
  - gateway.yaml
  - pki-and-secrets.yaml
  - databases.yaml
  - observability.yaml
  - apps.yaml
