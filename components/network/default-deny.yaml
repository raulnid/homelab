# Cluster-wide default-deny. Selecting every pod with an ingress and an egress section switches
# both directions to deny; everything else in this directory is an explicit allow for one flow.
# Host-network pods (cilium, node-exporter, spire-agent, tetragon) are not endpoints and are not affected.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny
spec:
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: Exists
  ingress:
    # kubelet probes come from the local node
    - fromEntities: [host]
    - fromEntities: [health]
  egress:
    - toEntities: [health]
    # every pod resolves through CoreDNS
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: coredns-ingress
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: kube-system
      k8s:k8s-app: kube-dns
  ingress:
    - fromEntities: [cluster]
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
