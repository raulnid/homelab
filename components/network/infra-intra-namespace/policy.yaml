# Intra-namespace traffic (same pattern as harbor-intra). Excludes net/system-controller pods.
# Deliberately NOT included (already covered, checked live: nothing to fix in AUDIT):
#   - flux-system: Flux installs its own NetworkPolicies (allow-egress/allow-scraping/allow-webhooks).
#   - monitoring, logging, telemetry: covered by observability-cross-namespace (same ns included).
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: valkey-intra
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: valkey
    matchExpressions:
      - key: "net/system-controller"
        operator: DoesNotExist
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: valkey
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: valkey
---
