apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: apps-egress-to-redis
spec:
  endpointSelector:
    matchLabels:
      net/to-redis: "true"
  egress:
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
