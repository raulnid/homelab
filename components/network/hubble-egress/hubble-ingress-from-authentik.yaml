apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: hubble-ingress-from-authentik
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: kube-system
      k8s-app: hubble-ui
  ingress:
    - fromEndpoints:
        - matchLabels:
            net/to-hubble: "true"
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
