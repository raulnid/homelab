# Garage on patron: the S3 backup target. Its bootstrap Job sets it up over the admin API; the backup
# clients (Longhorn, CNPG, OpenBao) get their allows here as they're wired in.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: garage
specs:
  - endpointSelector: { matchLabels: { k8s:io.kubernetes.pod.namespace: garage, app.kubernetes.io/name: garage } }
    ingress:
      - fromEndpoints: [{ matchLabels: { k8s:io.kubernetes.pod.namespace: garage, app.kubernetes.io/name: garage-bootstrap } }]
        toPorts: [{ ports: [{ port: "3903", protocol: TCP }] }]
  - endpointSelector: { matchLabels: { k8s:io.kubernetes.pod.namespace: garage, app.kubernetes.io/name: garage-bootstrap } }
    egress:
      - toEndpoints: [{ matchLabels: { k8s:io.kubernetes.pod.namespace: garage, app.kubernetes.io/name: garage } }]
        toPorts: [{ ports: [{ port: "3903", protocol: TCP }] }]
