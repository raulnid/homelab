apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: baseline-allow
spec:
  endpointSelector:                 # only real pods (excludes host, world, ingress, health, etc.)
    matchExpressions:
      - key: "k8s:io.kubernetes.pod.namespace"
        operator: Exists
      - key: "net/system-controller"     # exempts controllers that touch gateways (Cilium 1.19 bug with TLSRoute)
        operator: DoesNotExist
  ingress:
    # cilium-health agent-to-agent probes
    - fromEntities:
        - health
  egress:
    - toEntities:
        - health
    # DNS: every pod can reach CoreDNS. CoreDNS sends
    # the xzr.es lookups to .250
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
