# cert-manager -> step-ca (ACME) and OpenBao (vault issuers); External Secrets -> OpenBao.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: cert-manager-controller
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: cert-manager
      app.kubernetes.io/name: cert-manager
  egress:
    - toEndpoints: [{ matchLabels: { k8s:io.kubernetes.pod.namespace: step-ca, app: step-ca } }]
      toPorts: [{ ports: [{ port: "9000", protocol: TCP }] }]
    - toEndpoints: [{ matchLabels: { k8s:io.kubernetes.pod.namespace: openbao, app.kubernetes.io/name: openbao, component: server } }]
      toPorts: [{ ports: [{ port: "8200", protocol: TCP }] }]
    # DNS-01 propagation check against the recursor (--dns01-recursive-nameservers=192.168.1.250)
    - toEndpoints: [{ matchLabels: { k8s:io.kubernetes.pod.namespace: powerdns, app.kubernetes.io/name: powerdns-recursor } }]
      toPorts:
        - ports:
            - { port: "1053", protocol: UDP }
            - { port: "1053", protocol: TCP }
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: external-secrets-controller
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: external-secrets
      app.kubernetes.io/name: external-secrets
  egress:
    - toEndpoints: [{ matchLabels: { k8s:io.kubernetes.pod.namespace: openbao, app.kubernetes.io/name: openbao, component: server } }]
      toPorts: [{ ports: [{ port: "8200", protocol: TCP }] }]
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: openbao-server
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: openbao
      app.kubernetes.io/name: openbao
      component: server
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: external-secrets, app.kubernetes.io/name: external-secrets }
        - matchLabels: { k8s:io.kubernetes.pod.namespace: cert-manager, app.kubernetes.io/name: cert-manager }
      toPorts: [{ ports: [{ port: "8200", protocol: TCP }] }]
    # raft peers: API forwarding (8200) and cluster port (8201)
    - fromEndpoints: [{ matchLabels: { k8s:io.kubernetes.pod.namespace: openbao, app.kubernetes.io/name: openbao, component: server } }]
      toPorts:
        - ports:
            - { port: "8200", protocol: TCP }
            - { port: "8201", protocol: TCP }
  egress:
    - toEndpoints: [{ matchLabels: { k8s:io.kubernetes.pod.namespace: openbao, app.kubernetes.io/name: openbao, component: server } }]
      toPorts:
        - ports:
            - { port: "8200", protocol: TCP }
            - { port: "8201", protocol: TCP }
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: step-ca
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: step-ca
      app: step-ca
  ingress:
    - fromEndpoints: [{ matchLabels: { k8s:io.kubernetes.pod.namespace: cert-manager, app.kubernetes.io/name: cert-manager } }]
      toPorts: [{ ports: [{ port: "9000", protocol: TCP }] }]
    # ACME clients on the LAN through the 192.168.1.242 VIP
    - fromEntities: [world]
      toPorts: [{ ports: [{ port: "9000", protocol: TCP }] }]
