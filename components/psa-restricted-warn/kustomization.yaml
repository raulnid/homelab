# Pod Security Admission on 'restricted', warn-only and annotating the audit log (audit). Doesn't block any pod.
# To block, add the label pod-security.kubernetes.io/enforce: restricted.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: Namespace
    patch: |-
      - op: add
        path: /metadata/labels
        value:
          pod-security.kubernetes.io/warn: restricted
          pod-security.kubernetes.io/audit: restricted
