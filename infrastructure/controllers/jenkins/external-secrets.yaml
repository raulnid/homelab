# Admin user for the break-glass login (OIDC is the normal way in)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-admin
  namespace: jenkins
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: jenkins-admin
    template:
      type: Opaque
      data:
        jenkins-admin-user: "{{ .username }}"
        jenkins-admin-password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: infra/jenkins/admin
        property: username
    - secretKey: password
      remoteRef:
        key: infra/jenkins/admin
        property: password
---
# Same OIDC secret authentik reads for the Jenkins provider
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-oidc
  namespace: jenkins
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: jenkins-oidc
  data:
    - secretKey: client_secret
      remoteRef:
        key: infra/authentik/data
        property: jenkins
---
# Harbor push creds for the kaniko pods (mounted as /kaniko/.docker/config.json)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-push
  namespace: jenkins
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: harbor-push
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"hub.xzr.es":{"auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: infra/jenkins/harbor
        property: username
    - secretKey: password
      remoteRef:
        key: infra/jenkins/harbor
        property: password
