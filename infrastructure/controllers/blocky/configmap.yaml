---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blocky-config
  namespace: blocky
data:
  config.yml: |
    ports:
      dns: 1053
      http: 4000

    upstreams:
      groups:
        default:
          - 1.1.1.1
          - 1.0.0.1
      timeout: 2s
      init:
        strategy: fast

    # internal names via CoreDNS (10.96.0.10, kubeadm's fixed clusterDNS): xzr.es from powerdns-auth first
    conditional:
      mapping:
        xzr.es: 10.96.0.10
        cluster.local: 10.96.0.10

    blocking:
      denylists:
        ads:
          # wildcard format (*.domain) so subdomains are blocked too
          - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/pro.txt
          # Google ads that Hagezi Pro allows on purpose (breaks clicks on Google Shopping ads)
          - |
            *.doubleclick.net
            *.googleadservices.com
            *.googlesyndication.com
            *.adservice.google.com
      clientGroupsBlock:
        default:
          - ads
      blockType: zeroIp
      blockTTL: 1m
      loading:
        refreshPeriod: 24h
        # serve DNS straight away and keep the old list if a download fails
        strategy: fast

    caching:
      prefetching: true

    prometheus:
      enable: true

    queryLog:
      type: none
