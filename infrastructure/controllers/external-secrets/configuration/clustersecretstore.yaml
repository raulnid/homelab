apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-store
spec:
  provider:
    vault:
      server: "https://openbao-openbao.openbao.svc.cluster.local:8200"
      path: "secret"
      version: "v1"
      # read from the cert-manager CA secret so renewals are picked up
      caProvider:
        type: Secret
        name: internal-ca-tls
        key: tls.crt
        namespace: cert-manager
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
---
# Store for OpenBao's database engine (dynamic credentials).
# Unlike openbao-store, it has NO 'path': the database/ engine isn't KV,
# keys are read as a plain logical path (e.g. database/creds/dns).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-db-store
spec:
  provider:
    vault:
      server: "https://openbao-openbao.openbao.svc.cluster.local:8200"
      version: "v1"
      # read from the cert-manager CA secret so renewals are picked up
      caProvider:
        type: Secret
        name: internal-ca-tls
        key: tls.crt
        namespace: cert-manager
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
