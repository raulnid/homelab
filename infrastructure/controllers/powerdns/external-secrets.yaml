apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: powerdns-secret
  namespace: powerdns
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: powerdns-secret
    creationPolicy: Owner

  dataFrom:
    - extract:
        key: infra/powerdns/db-info
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: powerdns-db-creds
  namespace: powerdns
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: openbao-db-store
    kind: ClusterSecretStore
  target:
    name: powerdns-db-creds
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        user: "{{ .username }}"
        pass: "{{ .password }}"
  dataFrom:
    - extract:
        key: database/static-creds/dns_readwrite_static
