---
# Service for DNS queries (backend of UDPRoute and TCPRoute)
apiVersion: v1
kind: Service
metadata:
  name: powerdns-auth-dns
  namespace: powerdns
  labels:
    app.kubernetes.io/name: powerdns-auth
    app.kubernetes.io/component: dns
    app.kubernetes.io/part-of: powerdns
spec:
  type: ClusterIP
  ports:
  - name: dns-udp
    port: 53
    targetPort: dns-udp
    protocol: UDP
  - name: dns-tcp
    port: 53
    targetPort: dns-tcp
    protocol: TCP
  selector:
    app.kubernetes.io/name: powerdns-auth
    app.kubernetes.io/part-of: powerdns
---
# Service for the API (PowerDNS-Admin and cert-manager)
apiVersion: v1
kind: Service
metadata:
  name: powerdns-auth-api
  namespace: powerdns
  labels:
    app.kubernetes.io/name: powerdns-auth
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: powerdns
spec:
  type: ClusterIP
  ports:
  - name: api
    port: 8081
    targetPort: api
    protocol: TCP
  selector:
    app.kubernetes.io/name: powerdns-auth
    app.kubernetes.io/part-of: powerdns
