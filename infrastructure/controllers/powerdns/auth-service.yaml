---
# Service for DNS queries (backend of UDPRoute and TCPRoute)
apiVersion: v1
kind: Service
metadata:
  name: powerdns-auth-dns
  namespace: powerdns
  annotations:
    # clusterIP is immutable: let Flux recreate the Service when it changes
    kustomize.toolkit.fluxcd.io/force: Enabled
  labels:
    app.kubernetes.io/name: powerdns-auth
    app.kubernetes.io/component: dns
    app.kubernetes.io/part-of: powerdns
spec:
  type: ClusterIP
  # pinned: CoreDNS forwards xzr.es here and its forward plugin only takes IPs.
  # 10.96.0.0-255 is the static band of the /12 that the allocator leaves for fixed IPs.
  clusterIP: 10.96.0.53
  ports:
  - name: dns-udp
    port: 53
    targetPort: dns-udp
    protocol: UDP
  - name: dns-tcp
    port: 53
    targetPort: dns-tcp
    protocol: TCP
  selector:
    app.kubernetes.io/name: powerdns-auth
    app.kubernetes.io/part-of: powerdns
---
# Service for the API (PowerDNS-Admin and cert-manager)
apiVersion: v1
kind: Service
metadata:
  name: powerdns-auth-api
  namespace: powerdns
  labels:
    app.kubernetes.io/name: powerdns-auth
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: powerdns
spec:
  type: ClusterIP
  ports:
  - name: api
    port: 8081
    targetPort: api
    protocol: TCP
  selector:
    app.kubernetes.io/name: powerdns-auth
    app.kubernetes.io/part-of: powerdns
