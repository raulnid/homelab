---
# HTTPRoute for the PowerDNS-Admin web panel
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: powerdns-admin-route
  namespace: powerdns
spec:
  parentRefs:
  - name: cilium-gateway
    namespace: kube-system
  hostnames:
  - "dns.xzr.es"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: powerdns-admin
      port: 80
