# Client certificate for the "dns" Postgres user (24h, OpenBao PKI). pg's clientCASecret is the
# Homelab Root CA, so it validates this cert; pg_hba requires it on top of the password.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: powerdns-postgres
  namespace: powerdns
spec:
  secretName: powerdns-pg-tls
  duration: 24h
  renewBefore: 8h
  commonName: dns
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - client auth
    - digital signature
    - key encipherment
  issuerRef:
    name: openbao-pg-client
    kind: ClusterIssuer
    group: cert-manager.io
