---
# Dynamic client cert for the Postgres "dns" user, issued by OpenBao's PKI
# through cert-manager. The internal
# pg cluster validates it because its clientCASecret is the step-ca root, which
# signs OpenBao's intermediate. Mounted by pdns-auth and powerdns-admin.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: powerdns-postgres
  namespace: powerdns
spec:
  secretName: powerdns-pg-tls
  duration: 24h
  renewBefore: 8h
  commonName: dns
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - client auth
    - digital signature
    - key encipherment
  issuerRef:
    name: openbao-pg-client
    kind: ClusterIssuer
    group: cert-manager.io
