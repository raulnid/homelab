---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: powerdns-auth
  namespace: powerdns
  labels:
    app.kubernetes.io/name: powerdns-auth
    app.kubernetes.io/component: dns-server
    app.kubernetes.io/part-of: powerdns
  annotations:
    # Restart the pods when the password (static role) or the client cert (24h) rotates.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: powerdns-auth
      app.kubernetes.io/part-of: powerdns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: powerdns-auth
        app.kubernetes.io/component: dns-server
        net/to-cnpg-internal: "true"
        app.kubernetes.io/part-of: powerdns
    spec:
      securityContext:
        fsGroup: 953
      containers:
        - name: pdns-auth
          image: powerdns/pdns-auth-49:latest
          args:
            - --config-dir=/etc/powerdns
            - --gpgsql-host=$(PGHOST)
            - --gpgsql-port=$(PGPORT)
            - --gpgsql-dbname=$(PGDATABASE)
            - --gpgsql-user=$(PGUSER)
            - --gpgsql-password=$(PGPASSWORD)
            # verify-ca (not verify-full): we connect through the K8s Service because
            # PowerDNS can't resolve internal.xzr.es (it serves it
            # itself), and the server cert only has SANs for another domain; OpenBao's PKI
            # doesn't issue for .svc.cluster.local.
            - --gpgsql-extra-connection-parameters=sslmode=verify-ca sslrootcert=/etc/powerdns/ssl-ca/ca.crt sslcert=/etc/powerdns/ssl/tls.crt sslkey=/etc/powerdns/ssl/tls.key
            - --api-key=$(PDNS_API_KEY)
          ports:
            - name: dns-udp
              containerPort: 1053
              protocol: UDP
            - name: dns-tcp
              containerPort: 1053
              protocol: TCP
            - name: api
              containerPort: 8081
              protocol: TCP
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: powerdns-secret
                  key: host
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: powerdns-secret
                  key: port
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: powerdns-secret
                  key: database
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: powerdns-db-creds
                  key: user
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: powerdns-db-creds
                  key: pass
            - name: PDNS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: powerdns-secret
                  key: api_key
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/powerdns/pdns.conf
              subPath: pdns.conf
              readOnly: true
            - name: db-tls
              mountPath: /etc/powerdns/ssl
              readOnly: true
            - name: db-ca
              mountPath: /etc/powerdns/ssl-ca
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: powerdns-auth-config
        - name: db-tls
          secret:
            # defaultMode is the permissions in DECIMAL (NOT OCTAL), 416 would be 640 in octal.
            defaultMode: 416
            secretName: powerdns-pg-tls
        - name: db-ca
          secret:
            secretName: powerdns-pg-ca
