# kubeadm's CoreDNS config, taken over by Flux to add split-horizon for xzr.es:
# the public zone lives in Cloudflare, inside the cluster we want the PowerDNS records (gateway/LB IPs).
# Needed by step-ca (ACME DNS-01 checks), Jenkins (OIDC against auth.xzr.es) and kaniko (pushes to hub.xzr.es).
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    xzr.es:53 {
        errors
        cache 30
        # powerdns-recursor LB, it forwards xzr.es to powerdns-auth
        forward . 192.168.1.250
    }
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
