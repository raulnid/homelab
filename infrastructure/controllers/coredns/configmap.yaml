# kubeadm's CoreDNS config, taken over by Flux.
#  - xzr.es: internal records from powerdns-auth first; names it doesn't know (NXDOMAIN) fall back to the
#    public zone in Cloudflare. Blocky (.250) sends xzr.es here too, so the LAN gets the same answers.
#    No cache: cert-manager's DNS-01 check and step-ca's validation must see a new TXT straight away.
#  - everything else outside cluster.local: Cloudflare, unfiltered (ad blocking is only for the LAN).
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    xzr.es:53 {
        errors
        # powerdns-auth-dns (ClusterIP pinned in powerdns/auth-service.yaml)
        forward . 10.96.0.53 {
            next NXDOMAIN
        }
        forward . 1.1.1.1 1.0.0.1
    }
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        forward . 1.1.1.1 1.0.0.1 {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
