# kubeadm's CoreDNS config, taken over by Flux.
#  - xzr.es: internal records from powerdns-auth first; names it doesn't know (NXDOMAIN) fall back to the
#    public zone in Cloudflare. The .250 recursor sends xzr.es here too, so the LAN gets the same answers.
#  - everything else outside cluster.local: the powerdns-recursor LB (.250).
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    xzr.es:53 {
        errors
        cache 30
        # powerdns-auth-dns (ClusterIP pinned in powerdns/auth-service.yaml)
        forward . 10.103.117.139 {
            next NXDOMAIN
        }
        forward . 1.1.1.1 1.0.0.1
    }
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        forward . 192.168.1.250 {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
