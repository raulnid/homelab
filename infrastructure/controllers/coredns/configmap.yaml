# kubeadm's CoreDNS config, taken over by Flux: everything outside cluster.local goes to the powerdns-recursor
# LB (.250), the same DNS the LAN uses. It answers xzr.es from powerdns-auth (LAN IPs; the public zone is
# Cloudflare) and sends the rest to Cloudflare.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        forward . 192.168.1.250 {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
