apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-pg-ca
  namespace: authentik
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: authentik-pg-ca
    template:
      type: Opaque
      data:
        ca.crt: "{{ .ca }}"
  data:
    - secretKey: ca
      remoteRef:
        key: k8s/step-ca
        property: content
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-db-creds
  namespace: authentik
spec:
  refreshInterval: "30s"
  secretStoreRef:
    name: openbao-db-store
    kind: ClusterSecretStore
  target:
    name: authentik-db-creds
    creationPolicy: Owner
    # we filter the response, only username and password get used, the rest
    # (lease_id, ttl...) is available in the template but doesn't end up in the final secret
    template:
      type: Opaque
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: database/static-creds/authentik_readwrite_static
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-config
  namespace: authentik
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: authentik-config
    creationPolicy: Owner
  # extract copies the KV keys as-is (AUTHENTIK_SECRET_KEY,
  # AUTHENTIK_BOOTSTRAP_PASSWORD) as secret keys -> envFrom
  # injects them as env vars with that same name.
  dataFrom:
    - extract:
        key: infra/authentik/config
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-provider-secrets
  namespace: authentik
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: authentik-provider-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: infra/authentik/data
