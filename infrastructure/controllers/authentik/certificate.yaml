---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: authentik-pg-tls
  namespace: authentik
spec:
  secretName: authentik-pg-tls
  duration: 24h
  renewBefore: 8h
  commonName: authentik
  usages:
    - client auth
    - digital signature
    - key encipherment
  issuerRef:
    name: openbao-server
    kind: ClusterIssuer
    group: cert-manager.io
