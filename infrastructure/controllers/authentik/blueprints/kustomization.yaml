apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: authentik
configMapGenerator:
  - name: authentik-blueprints
    files:
      - flows.yaml
      - applications.yaml
      - providers.yaml
      - groups.yaml
      - stages.yaml
      - flow-bindings.yaml
generatorOptions:
  disableNameSuffixHash: true
