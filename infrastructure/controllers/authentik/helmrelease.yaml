---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 30m
  chart:
    spec:
      chart: authentik
      version: "2026.8.3"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    blueprints:
      configMaps:
        - authentik-blueprints
    authentik:
      # The chart ALWAYS references a config secret via envFrom (it's not optional:
      # see helper authentik.secret.name + envFrom in the chart's deployment).
      # Pointing existingSecret at authentik-config (ExternalSecret from OpenBao)
      # gets us two things: (1) that mandatory envFrom uses authentik-config, and
      # (2) the chart does NOT generate its own secret. AUTHENTIK_SECRET_KEY and
      # AUTHENTIK_BOOTSTRAP_PASSWORD come from KV infra/authentik/config.
      existingSecret:
        secretName: authentik-config

    global:
      deploymentAnnotations:
        # Restart the pods when the password (static role) or the client cert (24h) rotates.
        reloader.stakater.com/auto: "true"
      securityContext:
        # authentik runs as uid 1000; with fsGroup the mounted TLS key ends up
        # root:1000 0640, which is readable and passes libpq's permission check.
        fsGroup: 1000
      env:
        # No outbound calls to the internet: version check (version.goauthentik.io)
        # and startup analytics.
        - name: AUTHENTIK_DISABLE_UPDATE_CHECK
          value: "true"
        - name: AUTHENTIK_DISABLE_STARTUP_ANALYTICS
          value: "true"
        # Since 2025.x authentik doesn't use Redis: cache, sessions and tasks live in Postgres.
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: pg-rw.pg-internal.svc.cluster.local
        - name: AUTHENTIK_POSTGRESQL__NAME
          value: authentik
        - name: AUTHENTIK_POSTGRESQL__USER
          valueFrom:
            secretKeyRef:
              name: authentik-db-creds
              key: username
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-db-creds
              key: password
        - name: AUTHENTIK_POSTGRESQL__SSLMODE
          value: verify-full
        - name: AUTHENTIK_POSTGRESQL__SSLROOTCERT
          value: /etc/authentik/pg-ca/ca.crt

        - name: AUTHENTIK_PROVIDER_SECRET_FORGEJO
          valueFrom:
            secretKeyRef:
              name: authentik-provider-secrets
              key: forgejo
        - name: AUTHENTIK_PROVIDER_SECRET_OPENBAO
          valueFrom:
            secretKeyRef:
              name: authentik-provider-secrets
              key: openbao
        - name: AUTHENTIK_PROVIDER_SECRET_GRAFANA
          valueFrom:
            secretKeyRef:
              name: authentik-provider-secrets
              key: grafana
        - name: AUTHENTIK_PROVIDER_SECRET_HARBOR
          valueFrom:
            secretKeyRef:
              name: authentik-provider-secrets
              key: harbor
        - name: AUTHENTIK_PROVIDER_SECRET_JENKINS
          valueFrom:
            secretKeyRef:
              name: authentik-provider-secrets
              key: jenkins
        - name: AUTHENTIK_PROVIDER_SECRET_HUBBLE
          valueFrom:
            secretKeyRef:
              name: authentik-provider-secrets
              key: hubble

      volumes:
        - name: pg-ca
          secret:
            secretName: authentik-pg-ca
      volumeMounts:
        - name: pg-ca
          mountPath: /etc/authentik/pg-ca
          readOnly: true

    server:
      replicas: 1
      podLabels:
        net/from-public-gw: "true"
        # The embedded outpost proxies to hubble-ui (kube-system:8081) after authenticating.
        net/to-hubble: "true"
        net/to-cnpg-internal: "true"
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi

    worker:
      podLabels:
        net/to-cnpg-internal: "true"
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          memory: 1Gi
