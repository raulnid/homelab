apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey
  namespace: valkey
spec:
  interval: 10m0s
  chart:
    spec:
      chart: valkey
      version: "0.11.0" # Latest stable chart version
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: valkey
      interval: 1h
  values:
    auth:
      enabled: true
      # the reason static passwords are used is that
      # valkey rewrites the passwords on every pod reset,
      # so if openbao rotates them and they get changed again externally
      # openbao loses track; this way the passwords are always the same
      # and the cert is what changes every 24 hours
      usersExistingSecret: vk-users
      aclUsers:
        default:
          permissions: "~* &* +@all"
        auth:
          permissions: "~* &* +@all"

    replica:
      enabled: true
      replicas: 2
      disklessSync: false
      persistence:
        size: "5Gi"
    # no TLS for now (the PKI comes later); ACL users with static passwords
    tls:
      enabled: false
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

