apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vk-users
  namespace: valkey
spec:
  refreshInterval: "5m"
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: vk-users
    creationPolicy: Owner
  # high-entropy static passwords. OpenBao doesn't connect to Valkey,
  # so there's no rotation; rotation happens in the mTLS certs
  # every 24 hours, the passwords are 2FA
  data:
    - secretKey: default
      remoteRef:
        key: infra/valkey/production/acl
        property: default
    - secretKey: auth
      remoteRef:
        key: infra/valkey/production/acl
        property: auth
