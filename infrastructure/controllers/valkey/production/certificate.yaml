apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vk-server-tls
  namespace: valkey
spec:
  secretName: vk-server-tls
  duration: 2160h
  renewBefore: 360h
  commonName: valkey.xzr.es
  dnsNames:
    - valkey.xzr.es
  usages:
    - server auth
    # client auth because the replicas and the exporter
    # use this cert to connect over mTLS too
    - client auth
    - digital signature
    - key encipherment
  issuerRef:
    name: openbao-valkey
    kind: ClusterIssuer
    group: cert-manager.io
