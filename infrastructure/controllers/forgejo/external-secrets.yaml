apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-internal-ca
  namespace: forgejo
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: forgejo-internal-ca
    template:
      type: Opaque
      data:
        ca.crt: "{{ .ca }}"
  data:
    - secretKey: ca
      remoteRef:
        key: k8s/step-ca
        property: content
