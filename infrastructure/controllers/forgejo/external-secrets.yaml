apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-internal-ca
  namespace: forgejo
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: forgejo-internal-ca
    template:
      type: Opaque
      data:
        ca.crt: "{{ .ca }}"
  data:
    - secretKey: ca
      remoteRef:
        key: k8s/step-ca
        property: content
---
# OAuth client for the authentik "Provider for Forgejo" (same secret authentik reads)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-oidc
  namespace: forgejo
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: forgejo-oidc
    template:
      type: Opaque
      data:
        key: S6Yv5qaOFVsBzRjg8ZXqwlhBpNMprjMJ5MJNyyQm
        secret: "{{ .secret }}"
  data:
    - secretKey: secret
      remoteRef:
        key: infra/authentik/data
        property: forgejo
