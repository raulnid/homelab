---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo-route
  namespace: forgejo
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: kube-system
      sectionName: http

  hostnames:
    - "git.xzr.es"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: forgejo-http
          port: 3000
