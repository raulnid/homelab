apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: v1.14.5
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    installCRDs: true
    # metrics Service only; the ServiceMonitor lives in monitoring/ (its CRD comes with kube-prometheus-stack, a later stage)
    prometheus:
      enabled: true
      servicemonitor:
        enabled: false
    webhook:
      timeoutSeconds: 4
    # DNS-01 self-checks against CoreDNS, whose xzr.es block reads powerdns-auth uncached (it forwards xzr.es to powerdns-auth); public DNS is Cloudflare and never sees the TXT
    extraArgs:
      - --dns01-recursive-nameservers=10.96.0.10:53
      - --dns01-recursive-nameservers-only
