apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: v1.14.5
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    installCRDs: true
    prometheus:
      enabled: false
    webhook:
      timeoutSeconds: 4
    # DNS-01 self-checks against the recursor (it forwards xzr.es to powerdns-auth); public DNS is Cloudflare and never sees the TXT
    extraArgs:
      - --dns01-recursive-nameservers=192.168.1.250:53
      - --dns01-recursive-nameservers-only
