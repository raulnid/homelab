apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: step-ca-issuer-template
  namespace: cert-manager
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: step-ca-root
    template:
      engineVersion: v2
      data:
        root.crt: "{{ .content_b64 }}"

  data:
  - secretKey: content_b64
    remoteRef:
      key: k8s/step-ca
      property: content_b64
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: powerdns-api-key
  namespace: cert-manager
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: powerdns-api-key
    template:
      type: Opaque
      data:
        api-key: "{{ .api_key }}"
  data:
  - secretKey: api_key
    remoteRef:
      key: infra/powerdns/auth
      property: api_key
