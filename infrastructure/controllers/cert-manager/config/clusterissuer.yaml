apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: step-ca-issuer
spec:
  acme:
    email: admin@xzr.es
    server: https://cert.xzr.es/acme/acme/directory
    privateKeySecretRef:
      name: step-ca-issuer-account-key
    caBundle: 
    solvers:
    - dns01:
        webhook:
          groupName: acme.xzr.es
          solverName: pdns
          config:
            host: http://powerdns-auth-api.powerdns.svc.cluster.local:8081
            apiKeySecretRef:
              name: powerdns-api-key
              key: api-key
