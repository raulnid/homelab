apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: step-ca-issuer
spec:
  acme:
    email: admin@xzr.es
    # in-cluster URL: cert.xzr.es does not resolve from inside the cluster, and the step-ca cert has this SAN
    server: https://step-ca.step-ca.svc.cluster.local:9000/acme/acme/directory
    privateKeySecretRef:
      name: step-ca-issuer-account-key
    caBundle: 
    solvers:
    - dns01:
        webhook:
          groupName: acme.xzr.es
          solverName: pdns
          config:
            host: http://powerdns-auth-api.powerdns.svc.cluster.local:8081
            apiKeySecretRef:
              name: powerdns-api-key
              key: api-key
