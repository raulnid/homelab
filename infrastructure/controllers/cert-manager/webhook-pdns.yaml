apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-webhook-pdns
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager-webhook-pdns
      version: 3.2.3
      sourceRef:
        kind: HelmRepository
        name: cert-manager-webhook-pdns
        namespace: flux-system
  values:
    groupName: acme.xzr.es
    certManager:
      namespace: cert-manager
      serviceAccountName: cert-manager
