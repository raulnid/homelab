apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - repository.yaml
  - external-secrets.yaml
  - release.yaml
  - httproute.yaml
  - cert-manager.yaml
  - blocky.yaml
  - herakles.yaml
configMapGenerator:
  # picked up by Grafana's dashboard sidecar; a stable name so re-imports update it
  - name: herakles-dashboard
    namespace: monitoring
    files:
      - dashboards/herakles.json
    options:
      labels: { grafana_dashboard: "1" }
      disableNameSuffixHash: true
