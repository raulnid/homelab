# Grafana's authentik client secret (same key authentik reads for the provider)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: monitoring
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: grafana-oidc
  data:
    - secretKey: client_secret
      remoteRef:
        key: infra/authentik/data
        property: grafana
---
# Homelab Root CA, to verify auth.xzr.es
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-root-ca
  namespace: monitoring
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: homelab-root-ca
    template:
      type: Opaque
      data:
        ca.crt: "{{ .ca }}"
  data:
    - secretKey: ca
      remoteRef:
        key: k8s/step-ca
        property: content
