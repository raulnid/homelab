apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: blocky
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: [blocky]
  selector:
    matchLabels:
      app.kubernetes.io/name: blocky
  podMetricsEndpoints:
    - port: http
      interval: 60s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: blocky
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: blocky
      rules:
        # the whole LAN resolves through it
        - alert: BlockyDown
          expr: absent(up{job="monitoring/blocky"} == 1)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: no Blocky replica is up, LAN DNS is down
        - alert: BlockyDenylistEmpty
          expr: max(blocky_denylist_cache_entries) < 1000
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Blocky has no blocklist loaded
