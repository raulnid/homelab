apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "81.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 10m
  values:
    grafana:
      enabled: true
      # Login through authentik; role from the authentik groups, everyone else is Viewer
      grafana.ini:
        server:
          root_url: https://stats.xzr.es
        auth.generic_oauth:
          enabled: true
          name: authentik
          client_id: mIr7eDVDhDscRrMIshwTH6fVhrG9kybB8D4naAxN
          scopes: openid email profile
          auth_url: https://auth.xzr.es/application/o/authorize/
          token_url: https://auth.xzr.es/application/o/token/
          api_url: https://auth.xzr.es/application/o/userinfo/
          signout_redirect_url: https://auth.xzr.es/application/o/grafana/end-session/
          login_attribute_path: preferred_username
          role_attribute_path: contains(groups, 'Grafana Admins') && 'Admin' || contains(groups, 'Grafana Editors') && 'Editor' || 'Viewer'
          use_pkce: true
          # auth.xzr.es is served with a step-ca cert
          tls_client_ca: /etc/grafana/homelab-root-ca/ca.crt
      envValueFrom:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef:
            name: grafana-oidc
            key: client_secret
      extraSecretMounts:
        - name: homelab-root-ca
          secretName: homelab-root-ca
          mountPath: /etc/grafana/homelab-root-ca
          readOnly: true
      nodeSelector:
        monitoring-storage: "true"
      initChownData:
        enabled: false
      podSecurityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      ingress:
        enabled: false
      persistence:
        enabled: true
        storageClassName: local-path
        size: 10Gi
        accessModes: ["ReadWriteOnce"]
    prometheus:
      enabled: true
      prometheusSpec:
        nodeSelector:
          monitoring-storage: "true"
        additionalScrapeConfigs:
          - job_name: "vps-node-exporter"
            static_configs:
              - targets: ["wireguard.wireguard.svc:9100"]
                labels:
                  instance: "Gateway VPS"
            metrics_path: /metrics
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi
    alertmanager:
      enabled: true
    nodeExporter:
      serviceMonitor:
        relabelings:
          - action: replace
            sourceLabels: [__meta_kubernetes_node_name]
            targetLabel: instance
