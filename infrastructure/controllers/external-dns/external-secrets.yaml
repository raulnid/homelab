# PowerDNS API key (same one the pdns-auth pods use)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-pdns
  namespace: external-dns
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: external-dns-pdns
    template:
      type: Opaque
      data:
        api-key: "{{ .api_key }}"
  data:
    - secretKey: api_key
      remoteRef:
        key: infra/powerdns/db-info
        property: api_key
