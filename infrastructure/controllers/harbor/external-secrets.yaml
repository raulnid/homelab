# Admin password (break-glass; normal login is OIDC)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-admin
  namespace: harbor
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: harbor-admin
  data:
    - secretKey: HARBOR_ADMIN_PASSWORD
      remoteRef:
        key: infra/harbor/admin
        property: password
---
# Harbor OIDC config (core.configureUserSettings -> CONFIG_OVERWRITE_JSON), fed to the HelmRelease via valuesFrom.
# oidc_admin_group: members of the authentik group "Harbor Admins" are Harbor admins.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-oidc-values
  namespace: harbor
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: harbor-oidc-values
    template:
      engineVersion: v2
      data:
        values.yaml: |
          core:
            configureUserSettings: '{"auth_mode":"oidc_auth","oidc_name":"authentik","oidc_endpoint":"https://auth.xzr.es/application/o/harbor/","oidc_client_id":"r2eERKMiLP65L3vfyuytY3mYzJ6cY3m672CT0qRt","oidc_client_secret":"{{ .client_secret }}","oidc_scope":"openid,profile,email,offline_access","oidc_groups_claim":"groups","oidc_admin_group":"Harbor Admins","oidc_user_claim":"preferred_username","oidc_verify_cert":true,"oidc_auto_onboard":true}'
  data:
    - secretKey: client_secret
      remoteRef:
        key: infra/authentik/data
        property: harbor
---
# Homelab Root CA (caBundleSecretName needs the ca.crt key)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-root-ca
  namespace: harbor
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: homelab-root-ca
    template:
      type: Opaque
      data:
        ca.crt: "{{ .ca }}"
  data:
    - secretKey: ca
      remoteRef:
        key: k8s/step-ca
        property: content
