---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor
spec:
  interval: 30m
  chart:
    spec:
      chart: harbor
      version: "1.14.x"
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: harbor
      interval: 12h
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # OIDC settings (with the client secret) rendered by the harbor-oidc ExternalSecret
  valuesFrom:
    - kind: Secret
      name: harbor-oidc-values
      valuesKey: values.yaml
  values:
    expose:
      type: clusterIP
      tls:
        enabled: false
    database:
      type: internal
    redis:
      type: internal
    externalURL: https://hub.xzr.es
    # only read on the first install; the real password lives in OpenBao (infra/harbor/admin)
    existingSecretAdminPassword: harbor-admin
    # trust the Homelab Root CA (OIDC against auth.xzr.es)
    caBundleSecretName: homelab-root-ca
    persistence:
      enabled: true
      resourcePolicy: "keep"
      persistentVolumeClaim:
        registry:
          storageClass: "local-storage"
          accessMode: ReadWriteOnce
          size: 30Gi
        jobservice:
          jobLog:
            storageClass: "local-storage"
            accessMode: ReadWriteOnce
            size: 1Gi
        database:
          storageClass: "local-storage"
          accessMode: ReadWriteOnce
          size: 5Gi
        redis:
          storageClass: "local-storage"
          accessMode: ReadWriteOnce
          size: 1Gi
        trivy:
          storageClass: "local-storage"
          accessMode: ReadWriteOnce
          size: 5Gi
    registry:
      relativeurls: true
    nginx:
      clientMaxBodySize: 0
    nodeSelector:
      kubernetes.io/hostname: node2
