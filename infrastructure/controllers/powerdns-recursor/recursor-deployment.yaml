---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: powerdns-recursor
  namespace: powerdns
  labels:
    app.kubernetes.io/name: powerdns-recursor
    app.kubernetes.io/component: recursor
    app.kubernetes.io/part-of: powerdns
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: powerdns-recursor
      app.kubernetes.io/part-of: powerdns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: powerdns-recursor
        app.kubernetes.io/component: recursor
        app.kubernetes.io/part-of: powerdns
    spec:
      containers:
      - name: pdns-recursor
        image: powerdns/pdns-recursor-51:latest
        args:
          - --config-dir=/etc/powerdns-recursor
        ports:
        - name: dns-udp
          containerPort: 1053
          protocol: UDP
        - name: dns-tcp
          containerPort: 1053
          protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        readinessProbe:
          tcpSocket:
            port: dns-tcp
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /etc/powerdns-recursor
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: powerdns-recursor-config
          items:
          - key: recursor.yml
            path: recursor.yml
---
apiVersion: v1
kind: Service
metadata:
  name: powerdns-recursor
  namespace: powerdns
  labels:
    app.kubernetes.io/name: powerdns-recursor
    app.kubernetes.io/component: recursor
    app.kubernetes.io/part-of: powerdns
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.250
  ports:
  - name: dns-udp
    port: 53
    targetPort: dns-udp
    protocol: UDP
  - name: dns-tcp
    port: 53
    targetPort: dns-tcp
    protocol: TCP
  selector:
    app.kubernetes.io/name: powerdns-recursor
    app.kubernetes.io/part-of: powerdns
