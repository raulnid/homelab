apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cilium
      version: "1.19.2"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  values:
    routingMode: tunnel
    tunnelProtocol: vxlan
    ipam:
      mode: kubernetes
    # was `mtu: 1400`: the chart key is uppercase, so it was ignored. 1500 = eno1 MTU, Cilium sizes the pods from it
    MTU: 1500
    kubeProxyReplacement: true
    # Enforce the default-deny in components/network. `true` only logs would-be drops (verdict AUDIT in Hubble),
    # except at the gateway: its L7 check of in-cluster clients drops even in audit mode.
    policyAuditMode: false
    # roll the agents when cilium-config changes (otherwise toggles like the one above need a manual restart)
    rollOutCiliumPods: true
    gatewayAPI:
      enabled: true
    l2announcements:
      enabled: true
    l2NeighDiscovery:
      enabled: true
    externalIPs:
      enabled: true
    encryption:
      enabled: true
      type: ipsec
      ipsec:
        keyFile: keys
    authentication:
      enabled: true
      mutual:
        spire:
          enabled: true
          install:
            enabled: true
    operator:
      replicas: 1
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true
