apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: garage
resources:
  - namespace.yaml
  - storage.yaml
  - external-secret.yaml
  - deployment.yaml
  - bootstrap-job.yaml
configMapGenerator:
  - name: garage-config
    files: [garage.toml]
  - name: garage-bootstrap
    files: [bootstrap.py]
