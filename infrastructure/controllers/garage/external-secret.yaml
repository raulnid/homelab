# infra/garage in OpenBao: rpc_secret, admin_token, and one S3 key per client (<client>_key_id,
# <client>_secret_key). The bootstrap Job imports those keys, so the credentials live in OpenBao only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage
  namespace: garage
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: garage
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: infra/garage
