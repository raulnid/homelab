apiVersion: v1
kind: ConfigMap
metadata:
  name: step-ca-config
  namespace: step-ca
data:
  ca.json: |
    {
      "root": "/home/step/certs/root_ca.crt",
      "federatedRoots": null,
      "crt": "/home/step/certs/intermediate_ca.crt",
      "key": "/home/step/secrets/intermediate_ca_key",
      "address": ":9000",
      "dnsNames": [
        "cert.xzr.es",
        "step-ca.step-ca.svc.cluster.local"
      ],
      "logger": {
        "format": "json"
      },
      "db": {
        "type": "postgresql",
        "dataSource": "postgres://__DB_USER__:__DB_PASSWORD__@pg-rw.pg-internal.svc.cluster.local:5432/stepca?sslmode=disable"
      },
      "authority": {
        "provisioners": [
          {
            "type": "JWK",
            "name": "admin",
            "key": {
              "use": "sig",
              "kty": "EC",
              "kid": "g0tTGTRRYT8i8rAx5eRgB0qWCDo3jo1TITsQl9slm1I",
              "crv": "P-256",
              "alg": "ES256",
              "x": "ilqVJxk4U5mF8OWYgnrfc3pm1w7Jcbhd6fQHYD6iWAk",
              "y": "QhK6a0REnWlL81LUjrDMgXW4GS_5BFbJXjrY126719w"
            }
          }
        ],
        "template": {},
        "backdate": "1m0s"
      },
      "tls": {
        "cipherSuites": [
          "TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256",
          "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256"
        ],
        "minVersion": 1.2,
        "maxVersion": 1.3,
        "renegotiation": false
      },
      "commonName": "Step Online CA",
      "crl": {
        "enabled": true,
        "generateOnRevoke": true,
        "cacheDuration": "1m0s"
      }
    }
