apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: step-ca-db
  namespace: step-ca
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: step-ca-db
  data:
    - secretKey: username
      remoteRef:
        key: database/static-creds/stepca-static
        property: username
    - secretKey: password
      remoteRef:
        key: database/static-creds/stepca-static
        property: password
