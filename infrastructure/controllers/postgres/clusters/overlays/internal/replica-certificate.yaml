# Client certificate CNPG uses for streaming_replica between instances (24h, OpenBao PKI).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pg-replica-tls
  namespace: pg-internal
spec:
  secretName: pg-replica-tls
  duration: 24h
  renewBefore: 8h
  commonName: streaming_replica
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - client auth
    - digital signature
    - key encipherment
  issuerRef:
    name: openbao-pg-replica
    kind: ClusterIssuer
    group: cert-manager.io
