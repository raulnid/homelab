# Homelab root CA: what clients (and the replicas) use to verify the server cert
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-server-ca
  namespace: pg-internal
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: pg-server-ca
    template:
      type: Opaque
      data:
        ca.crt: "{{ .content }}"
  data:
    - secretKey: content
      remoteRef:
        key: k8s/step-ca
        property: content
