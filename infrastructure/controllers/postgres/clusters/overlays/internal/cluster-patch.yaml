apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
spec:
  instances: 3
  # Every cert comes from the OpenBao PKI. Clients are validated against the Homelab Root CA, so the
  # operator no longer runs its own client CA.
  certificates:
    serverTLSSecret: pg-server-tls
    serverCASecret: pg-server-ca
    clientCASecret: pg-server-ca
    replicationTLSSecret: pg-replica-tls
  postgresql:
    # App users need a client cert whose CN is their role name, on top of the password.
    pg_hba:
      - hostssl all dns,authentik,stepca,miniflux,linkding all scram-sha-256 clientcert=verify-full
      - host all dns,authentik,stepca,miniflux,linkding all reject
  # Roles of the apps added later. No passwordSecret: OpenBao's static roles set and rotate the password.
  managed:
    roles:
      - { name: miniflux, ensure: present, login: true }
      - { name: linkding, ensure: present, login: true }
  storage:
    size: 10Gi
    storageClass: postgres-local

  enableSuperuserAccess: true

  affinity:
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
