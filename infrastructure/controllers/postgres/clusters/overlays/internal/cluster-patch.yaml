apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
spec:
  instances: 3
  # server cert from the OpenBao PKI; the client CA and the streaming_replica cert stay managed by the operator
  certificates:
    serverTLSSecret: pg-server-tls
    serverCASecret: pg-server-ca
  storage:
    size: 10Gi
    storageClass: postgres-local

  enableSuperuserAccess: true

  affinity:
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
